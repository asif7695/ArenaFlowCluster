# kind cluster for the ArenaFlowCluster live demo: 1 control-plane + 2 workers,
# so `kubectl get nodes` shows a real multi-node cluster the scheduler reads.
# Create with:  kind create cluster --name arenaflow --config k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: arenaflow
nodes:
  - role: control-plane
  - role: worker
  - role: worker
